<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design Canvas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --panel-2: #1e2536;
    --border: #2a3349;
    --text: #e6ebf5;
    --muted: #8b97b0;
    --accent: #4f8cff;
    --accent-2: #34d399;
    --danger: #f87171;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  header h1 { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  header .hint { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12.5px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  header button:hover { background: #263049; border-color: #3a4a6b; }
  header button.danger:hover { border-color: var(--danger); color: var(--danger); }

  .layout { flex: 1; display: flex; min-height: 0; }

  /* Palette */
  .palette {
    width: 210px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 10px;
    flex-shrink: 0;
  }
  .palette h2 {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    margin: 14px 6px 8px;
  }
  .palette h2:first-child { margin-top: 0; }
  .pal-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: grab;
    user-select: none;
    border: 1px solid transparent;
    transition: background .12s, border-color .12s;
  }
  .pal-item:hover { background: var(--panel-2); border-color: var(--border); }
  .pal-item:active { cursor: grabbing; }
  .pal-item .ico { width: 26px; height: 26px; flex-shrink: 0; }
  .pal-item span { font-size: 12.5px; }

  /* Canvas */
  .canvas-wrap { flex: 1; position: relative; overflow: hidden; }
  #canvas {
    position: absolute;
    inset: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle, #232c42 1px, transparent 1px);
    background-size: 22px 22px;
  }
  svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  svg.edges path { pointer-events: stroke; }

  .node {
    position: absolute;
    width: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: grab;
    user-select: none;
    z-index: 3;
  }
  .node.dragging { cursor: grabbing; z-index: 10; }
  .node .box {
    width: 64px; height: 64px;
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .12s, box-shadow .12s;
    position: relative;
  }
  .node.selected .box { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.22); }
  .node.link-source .box { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(52,211,153,.25); }
  .node .box svg { width: 34px; height: 34px; }
  .node .label {
    font-size: 11.5px;
    text-align: center;
    color: var(--text);
    line-height: 1.2;
    max-width: 96px;
    outline: none;
  }
  .node .label:focus { color: var(--accent); }

  /* connection port */
  .port {
    position: absolute;
    top: 50%; right: -9px;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    background: var(--accent-2);
    border: 2px solid var(--bg);
    border-radius: 50%;
    cursor: crosshair;
    opacity: 0;
    transition: opacity .12s, transform .12s;
  }
  .node:hover .port, .node.selected .port { opacity: 1; }
  .port:hover { transform: translateY(-50%) scale(1.25); }

  .edge-label {
    fill: var(--muted);
    font-size: 11px;
    font-family: inherit;
  }

  .empty-state {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    color: var(--muted);
    pointer-events: none;
    font-size: 14px;
    line-height: 1.7;
  }
  .empty-state .big { font-size: 40px; margin-bottom: 8px; }

  .ctx {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .ctx button {
    display: block; width: 100%;
    background: none; border: none; color: var(--text);
    padding: 7px 14px 7px 12px; text-align: left;
    font-size: 12.5px; cursor: pointer; border-radius: 5px;
  }
  .ctx button:hover { background: var(--panel-2); }
  .ctx button.danger:hover { color: var(--danger); }

  /* Header select styled like a button */
  header select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12.5px;
    cursor: pointer;
  }
  header select:hover { background: #263049; }

  /* Region / group box */
  .region {
    position: absolute;
    z-index: 1;
    border: 1.5px dashed var(--reg, #4f8cff);
    border-radius: 12px;
    background: color-mix(in srgb, var(--reg, #4f8cff) 8%, transparent);
    min-width: 120px; min-height: 90px;
  }
  .region .r-title {
    position: absolute;
    top: -11px; left: 12px;
    background: var(--bg);
    padding: 1px 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--reg, #4f8cff);
    border-radius: 6px;
    cursor: move;
    user-select: none;
    outline: none;
    white-space: nowrap;
  }
  .region .r-title:focus { color: var(--text); }
  .region.selected { box-shadow: 0 0 0 2px color-mix(in srgb, var(--reg,#4f8cff) 45%, transparent); }
  .region .r-resize {
    position: absolute;
    right: -6px; bottom: -6px;
    width: 14px; height: 14px;
    border-radius: 4px;
    background: var(--reg, #4f8cff);
    border: 2px solid var(--bg);
    cursor: nwse-resize;
    opacity: 0;
    transition: opacity .12s;
  }
  .region:hover .r-resize, .region.selected .r-resize { opacity: 1; }
  .region .r-del {
    position: absolute;
    top: -11px; right: 8px;
    width: 20px; height: 20px;
    line-height: 18px; text-align: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s, color .12s;
  }
  .region:hover .r-del, .region.selected .r-del { opacity: 1; }
  .region .r-del:hover { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>🧩 System Design Canvas</h1>
  <span class="hint">Drag components in · drag the green dot to connect · double-click a label to rename</span>
  <div class="spacer"></div>
  <select id="tpl-select" title="Load a template">
    <option value="">Templates…</option>
    <option value="url">URL Shortener</option>
    <option value="chat">Chat App</option>
    <option value="feed">News Feed</option>
  </select>
  <button id="btn-region">+ Region</button>
  <button id="btn-edgestyle">Edges: Curved</button>
  <button id="btn-export">Export JSON</button>
  <button id="btn-import">Import</button>
  <button class="danger" id="btn-clear">Clear</button>
  <input type="file" id="file-input" accept="application/json" hidden>
</header>

<div class="layout">
  <aside class="palette" id="palette"></aside>
  <div class="canvas-wrap">
    <div id="canvas">
      <svg class="edges" id="edges">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#5b6b8c"/>
          </marker>
        </defs>
      </svg>
      <div class="empty-state" id="empty">
        <div class="big">🖱️</div>
        Drag a component from the left onto the canvas<br>to start designing your system
      </div>
    </div>
  </div>
</div>

<script>
// ---- Icon library (inline SVGs) ----
const I = {
  client: `<svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>`,
  mobile: `<svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>`,
  browser: `<svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 9h18M3 15h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>`,
  dns: `<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><path d="M5.6 6.5c2 1.2 10.8 1.2 12.8 0M5.6 17.5c2-1.2 10.8-1.2 12.8 0"/></svg>`,
  cdn: `<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15a4 4 0 0 1 .6-7.97A6 6 0 0 1 18.5 8.5 3.5 3.5 0 0 1 18 15z"/><path d="M8 19h8M12 15v4"/></svg>`,
  lb: `<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><circle cx="5" cy="20" r="2"/><circle cx="12" cy="20" r="2"/><circle cx="19" cy="20" r="2"/><path d="M12 6v4M12 10H5v8M12 10v8M12 10h7v8"/></svg>`,
  gateway: `<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3z"/><path d="M8 5v14M16 5v14"/><path d="M11 12h5M14 9l3 3-3 3"/></svg>`,
  server: `<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>`,
  micro: `<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
  worker: `<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>`,
  db: `<svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>`,
  sql: `<svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/><path d="M9 18l1.5-1.5M9 16.5L10.5 18"/></svg>`,
  nosql: `<svg viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v3h3M9 12h6M9 16h6"/></svg>`,
  cache: `<svg viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>`,
  queue: `<svg viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="4" height="6" rx="1"/><rect x="8" y="9" width="4" height="6" rx="1"/><rect x="14" y="9" width="4" height="6" rx="1"/><path d="M20 12h2M18 12h.01"/></svg>`,
  stream: `<svg viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8c4 0 4 3 8 3s4-3 8-3M3 14c4 0 4 3 8 3s4-3 8-3"/></svg>`,
  blob: `<svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
  monitor: `<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>`,
  auth: `<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2"/></svg>`,
  external: `<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 12h4M14 10l3 2-3 2"/></svg>`,
  scheduler: `<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  config: `<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>`,
};

// ---- Palette definition ----
const PALETTE = [
  { group: "Clients", items: [
    { key: "browser", label: "Web Client", icon: "browser" },
    { key: "mobile", label: "Mobile App", icon: "mobile" },
    { key: "client", label: "Desktop", icon: "client" },
    { key: "external", label: "3rd-party API", icon: "external" },
  ]},
  { group: "Edge / Routing", items: [
    { key: "dns", label: "DNS", icon: "dns" },
    { key: "cdn", label: "CDN", icon: "cdn" },
    { key: "lb", label: "Load Balancer", icon: "lb" },
    { key: "gateway", label: "API Gateway", icon: "gateway" },
    { key: "auth", label: "Auth Service", icon: "auth" },
  ]},
  { group: "Compute", items: [
    { key: "server", label: "App Server", icon: "server" },
    { key: "micro", label: "Microservice", icon: "micro" },
    { key: "worker", label: "Worker", icon: "worker" },
    { key: "scheduler", label: "Scheduler", icon: "scheduler" },
  ]},
  { group: "Data", items: [
    { key: "sql", label: "SQL DB", icon: "sql" },
    { key: "nosql", label: "NoSQL DB", icon: "nosql" },
    { key: "cache", label: "Cache", icon: "cache" },
    { key: "blob", label: "Object Store", icon: "blob" },
    { key: "search", label: "Search Index", icon: "search" },
  ]},
  { group: "Async / Ops", items: [
    { key: "queue", label: "Message Queue", icon: "queue" },
    { key: "stream", label: "Event Stream", icon: "stream" },
    { key: "config", label: "Config / Registry", icon: "config" },
    { key: "monitor", label: "Monitoring", icon: "monitor" },
  ]},
];

// ---- State ----
let nodes = {};   // id -> {id, key, label, x, y, el}
let edges = [];   // {id, from, to, label, el, textEl}
let regions = []; // {id, title, x, y, w, h, color, el}
let nid = 0, eid = 0, rid = 0;
let selected = null;      // selected node id
let linking = null;       // {fromId, tempPath}
let edgeMode = 'curved';  // 'curved' | 'ortho'

const canvas = document.getElementById('canvas');
const svg = document.getElementById('edges');
const empty = document.getElementById('empty');

// ---- Build palette ----
const paletteEl = document.getElementById('palette');
PALETTE.forEach(sec => {
  const h = document.createElement('h2'); h.textContent = sec.group; paletteEl.appendChild(h);
  sec.items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'pal-item';
    d.draggable = true;
    d.innerHTML = `<span class="ico">${I[it.icon]}</span><span>${it.label}</span>`;
    d.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', JSON.stringify(it));
    });
    paletteEl.appendChild(d);
  });
});

// ---- Drop to create node ----
canvas.addEventListener('dragover', e => e.preventDefault());
canvas.addEventListener('drop', e => {
  e.preventDefault();
  let data;
  try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
  const r = canvas.getBoundingClientRect();
  createNode(data, e.clientX - r.left - 48, e.clientY - r.top - 32);
});

function createNode(def, x, y, id, label) {
  const nodeId = id || ('n' + (++nid));
  const el = document.createElement('div');
  el.className = 'node';
  el.style.left = Math.max(0, x) + 'px';
  el.style.top = Math.max(0, y) + 'px';
  el.innerHTML = `
    <div class="box">${I[def.icon]}<div class="port" data-port></div></div>
    <div class="label" contenteditable="false">${label || def.label}</div>`;
  canvas.appendChild(el);
  const node = { id: nodeId, key: def.key, icon: def.icon, label: label || def.label, x: Math.max(0,x), y: Math.max(0,y), el };
  nodes[nodeId] = node;
  wireNode(node);
  empty.style.display = 'none';
  return node;
}

function wireNode(node) {
  const el = node.el;
  const box = el.querySelector('.box');
  const port = el.querySelector('[data-port]');
  const label = el.querySelector('.label');

  // select
  el.addEventListener('mousedown', () => selectNode(node.id));

  // dragging the node
  box.addEventListener('mousedown', e => {
    if (e.target === port) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const ox = node.x, oy = node.y;
    el.classList.add('dragging');
    function move(ev) {
      node.x = Math.max(0, ox + ev.clientX - startX);
      node.y = Math.max(0, oy + ev.clientY - startY);
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      updateEdges();
    }
    function up() {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  // start a link from the port
  port.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    el.classList.add('link-source');
    const tmp = document.createElementNS('http://www.w3.org/2000/svg','path');
    tmp.setAttribute('stroke', '#34d399');
    tmp.setAttribute('stroke-width', '2');
    tmp.setAttribute('stroke-dasharray', '5 4');
    tmp.setAttribute('fill', 'none');
    svg.appendChild(tmp);
    linking = { fromId: node.id, tmp };
    function move(ev) {
      const r = canvas.getBoundingClientRect();
      const s = portCenter(node);
      tmp.setAttribute('d', curve(s.x, s.y, ev.clientX - r.left, ev.clientY - r.top));
    }
    function up(ev) {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      el.classList.remove('link-source');
      svg.removeChild(tmp);
      // find target node under cursor
      const target = document.elementFromPoint(ev.clientX, ev.clientY);
      const tn = target && target.closest('.node');
      if (tn) {
        const toId = Object.values(nodes).find(n => n.el === tn)?.id;
        if (toId && toId !== node.id) createEdge(node.id, toId);
      }
      linking = null;
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  // rename on double click
  label.addEventListener('dblclick', () => {
    label.contentEditable = 'true';
    label.focus();
    document.execCommand && document.getSelection().selectAllChildren(label);
  });
  label.addEventListener('blur', () => {
    label.contentEditable = 'false';
    node.label = label.textContent.trim() || node.label;
    label.textContent = node.label;
  });
  label.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); label.blur(); }
  });
}

function selectNode(id) {
  if (selected && nodes[selected]) nodes[selected].el.classList.remove('selected');
  selected = id;
  if (nodes[id]) {
    nodes[id].el.classList.add('selected');
    regions.forEach(r => r.el.classList.remove('selected'));
    selectedRegion = null;
  }
}

// ---- Edges ----
function portCenter(node) { return { x: node.x + 96 - 16, y: node.y + 32 }; } // near right port
function nodeCenter(node) { return { x: node.x + 48, y: node.y + 32 }; }

function curve(x1, y1, x2, y2) {
  if (edgeMode === 'ortho') {
    const mx = (x1 + x2) / 2;
    return `M ${x1} ${y1} L ${mx} ${y1} L ${mx} ${y2} L ${x2} ${y2}`;
  }
  const dx = Math.abs(x2 - x1) * 0.5 + 20;
  return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

function createEdge(from, to, id, lbl) {
  if (edges.some(e => e.from === from && e.to === to)) return;
  const edgeId = id || ('e' + (++eid));
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('stroke', '#5b6b8c');
  path.setAttribute('stroke-width', '2');
  path.setAttribute('fill', 'none');
  path.setAttribute('marker-end', 'url(#arrow)');
  path.style.cursor = 'pointer';
  const text = document.createElementNS('http://www.w3.org/2000/svg','text');
  text.setAttribute('class', 'edge-label');
  text.setAttribute('text-anchor', 'middle');
  text.textContent = lbl || '';
  svg.appendChild(path); svg.appendChild(text);
  const edge = { id: edgeId, from, to, label: lbl || '', el: path, textEl: text };
  edges.push(edge);

  path.addEventListener('click', e => { e.stopPropagation(); selectEdge(edge, e); });
  text.addEventListener('click', e => { e.stopPropagation(); renameEdge(edge); });
  updateEdges();
}

function selectEdge(edge, e) {
  edges.forEach(ed => ed.el.setAttribute('stroke', '#5b6b8c'));
  edge.el.setAttribute('stroke', '#4f8cff');
  showEdgeMenu(edge, e.clientX, e.clientY);
}

function renameEdge(edge) {
  const v = prompt('Edge label (e.g. "reads", "publishes", "gRPC"):', edge.label);
  if (v !== null) { edge.label = v.trim(); updateEdges(); }
}

function updateEdges() {
  edges.forEach(e => {
    const a = nodes[e.from], b = nodes[e.to];
    if (!a || !b) return;
    const s = portCenter(a);
    const t = { x: b.x + 48, y: b.y + 32 };
    // aim at left/right edge of target depending on direction
    const tx = t.x + (s.x > t.x ? 48 : -48);
    e.el.setAttribute('d', curve(s.x, s.y, tx, t.y));
    e.textEl.setAttribute('x', (s.x + tx) / 2);
    e.textEl.setAttribute('y', (s.y + t.y) / 2 - 6);
    e.textEl.textContent = e.label;
  });
}

// ---- Context menu / delete ----
let ctxEl = null;
function closeCtx() { if (ctxEl) { ctxEl.remove(); ctxEl = null; } }
function showEdgeMenu(edge, x, y) {
  closeCtx();
  const m = document.createElement('div'); m.className = 'ctx';
  m.style.left = x + 'px'; m.style.top = y + 'px';
  m.innerHTML = `<button data-a="label">✎ Label edge</button><button class="danger" data-a="del">🗑 Delete edge</button>`;
  document.body.appendChild(m); ctxEl = m;
  m.querySelector('[data-a="label"]').onclick = () => { closeCtx(); renameEdge(edge); };
  m.querySelector('[data-a="del"]').onclick = () => { closeCtx(); deleteEdge(edge); };
}
function deleteEdge(edge) {
  edge.el.remove(); edge.textEl.remove();
  edges = edges.filter(e => e !== edge);
}
function deleteNode(id) {
  const n = nodes[id]; if (!n) return;
  edges.filter(e => e.from === id || e.to === id).forEach(deleteEdge);
  n.el.remove(); delete nodes[id];
  if (selected === id) selected = null;
  refreshEmpty();
}
function refreshEmpty() {
  const isEmpty = Object.keys(nodes).length === 0 && regions.length === 0;
  empty.style.display = isEmpty ? 'block' : 'none';
}

document.addEventListener('click', e => {
  if (ctxEl && !ctxEl.contains(e.target)) closeCtx();
});
canvas.addEventListener('mousedown', e => {
  if (e.target === canvas || e.target === svg) {
    selectNode(null);
    regions.forEach(r => r.el.classList.remove('selected'));
    selectedRegion = null;
  }
});

// keyboard delete
document.addEventListener('keydown', e => {
  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  const activeEditable = document.activeElement && document.activeElement.isContentEditable;
  if (activeEditable) return;
  if (selected) deleteNode(selected);
  else if (selectedRegion) { const r = regions.find(r => r.id === selectedRegion); if (r) deleteRegion(r); }
});

// ---- Regions (group boxes) ----
const REGION_COLORS = ['#4f8cff','#34d399','#fbbf24','#f87171','#a78bfa','#38bdf8'];
let selectedRegion = null;

function createRegion(opts = {}) {
  const id = opts.id || ('r' + (++rid));
  const el = document.createElement('div');
  el.className = 'region';
  const color = opts.color || REGION_COLORS[regions.length % REGION_COLORS.length];
  el.style.setProperty('--reg', color);
  const x = opts.x ?? 80, y = opts.y ?? 80, w = opts.w ?? 260, h = opts.h ?? 180;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.innerHTML = `
    <div class="r-title" contenteditable="false">${opts.title || 'Region'}</div>
    <div class="r-del" title="Delete region">✕</div>
    <div class="r-resize"></div>`;
  canvas.appendChild(el);
  const reg = { id, title: opts.title || 'Region', x, y, w, h, color, el };
  regions.push(reg);
  wireRegion(reg);
  empty.style.display = 'none';
  return reg;
}

function wireRegion(reg) {
  const el = reg.el;
  const title = el.querySelector('.r-title');
  const resize = el.querySelector('.r-resize');
  const del = el.querySelector('.r-del');

  el.addEventListener('mousedown', e => { if (e.target === el) selectRegion(reg.id); });

  // drag whole region by its title bar
  title.addEventListener('mousedown', e => {
    if (title.isContentEditable) return;
    e.preventDefault(); e.stopPropagation();
    selectRegion(reg.id);
    const sx = e.clientX, sy = e.clientY, ox = reg.x, oy = reg.y;
    function move(ev) {
      reg.x = Math.max(0, ox + ev.clientX - sx);
      reg.y = Math.max(0, oy + ev.clientY - sy);
      el.style.left = reg.x + 'px'; el.style.top = reg.y + 'px';
    }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });

  // resize
  resize.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, ow = reg.w, oh = reg.h;
    function move(ev) {
      reg.w = Math.max(120, ow + ev.clientX - sx);
      reg.h = Math.max(90, oh + ev.clientY - sy);
      el.style.width = reg.w + 'px'; el.style.height = reg.h + 'px';
    }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });

  // rename title
  title.addEventListener('dblclick', () => {
    title.contentEditable = 'true'; title.focus();
    document.getSelection().selectAllChildren(title);
  });
  title.addEventListener('blur', () => {
    title.contentEditable = 'false';
    reg.title = title.textContent.trim() || reg.title;
    title.textContent = reg.title;
  });
  title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } });

  del.addEventListener('click', e => { e.stopPropagation(); deleteRegion(reg); });
}

function selectRegion(id) {
  regions.forEach(r => r.el.classList.toggle('selected', r.id === id));
  selectedRegion = id;
  selectNode(null);
}
function deleteRegion(reg) {
  reg.el.remove();
  regions = regions.filter(r => r !== reg);
  if (selectedRegion === reg.id) selectedRegion = null;
  refreshEmpty();
}

document.getElementById('btn-region').onclick = () => {
  const r = canvas.getBoundingClientRect();
  createRegion({ x: 60 + Math.random()*40, y: 60 + Math.random()*40 });
};

// ---- Edge style toggle ----
document.getElementById('btn-edgestyle').onclick = () => {
  edgeMode = edgeMode === 'curved' ? 'ortho' : 'curved';
  document.getElementById('btn-edgestyle').textContent =
    'Edges: ' + (edgeMode === 'curved' ? 'Curved' : 'Orthogonal');
  updateEdges();
};

// ---- Templates ----
const TEMPLATES = {
  url: {
    nodes: [
      { key:'browser', icon:'browser', label:'Client', x:40, y:200 },
      { key:'lb', icon:'lb', label:'Load Balancer', x:200, y:200 },
      { key:'server', icon:'server', label:'API Server', x:370, y:200 },
      { key:'cache', icon:'cache', label:'Cache', x:540, y:90 },
      { key:'sql', icon:'sql', label:'URL DB', x:540, y:300 },
      { key:'blob', icon:'blob', label:'ID Generator', x:370, y:360 },
    ],
    edges: [ [0,1,'HTTPS'],[1,2,''],[2,3,'read'],[2,4,'read/write'],[2,5,'gen id'] ],
    regions: [ { title:'Backend', x:340, y:150, w:400, h:280, color:'#34d399' } ],
  },
  chat: {
    nodes: [
      { key:'mobile', icon:'mobile', label:'Mobile', x:40, y:230 },
      { key:'gateway', icon:'gateway', label:'WS Gateway', x:210, y:230 },
      { key:'micro', icon:'micro', label:'Chat Service', x:380, y:230 },
      { key:'queue', icon:'queue', label:'Msg Queue', x:380, y:90 },
      { key:'nosql', icon:'nosql', label:'Messages DB', x:560, y:230 },
      { key:'worker', icon:'worker', label:'Push Worker', x:560, y:90 },
    ],
    edges: [ [0,1,'WebSocket'],[1,2,''],[2,3,'publish'],[3,5,'consume'],[2,4,'store'] ],
    regions: [ { title:'Realtime Backend', x:350, y:50, w:400, h:320, color:'#a78bfa' } ],
  },
  feed: {
    nodes: [
      { key:'browser', icon:'browser', label:'Client', x:40, y:220 },
      { key:'cdn', icon:'cdn', label:'CDN', x:200, y:110 },
      { key:'gateway', icon:'gateway', label:'API Gateway', x:200, y:300 },
      { key:'micro', icon:'micro', label:'Feed Service', x:380, y:300 },
      { key:'cache', icon:'cache', label:'Feed Cache', x:560, y:200 },
      { key:'nosql', icon:'nosql', label:'Posts DB', x:560, y:380 },
      { key:'stream', icon:'stream', label:'Fanout Stream', x:380, y:440 },
    ],
    edges: [ [0,1,'assets'],[0,2,'API'],[2,3,''],[3,4,'read'],[3,5,'read'],[3,6,'fanout'] ],
    regions: [ { title:'Feed Backend', x:350, y:160, w:400, h:340, color:'#38bdf8' } ],
  },
};

function loadTemplate(key) {
  const t = TEMPLATES[key]; if (!t) return;
  clearAll();
  (t.regions || []).forEach(r => createRegion(r));
  const made = t.nodes.map(n => createNode({ key:n.key, icon:n.icon, label:n.label }, n.x, n.y));
  (t.edges || []).forEach(([a,b,l]) => createEdge(made[a].id, made[b].id, null, l));
}
document.getElementById('tpl-select').onchange = e => {
  const v = e.target.value;
  if (v) {
    if (Object.keys(nodes).length && !confirm('Replace the current canvas with this template?')) {
      e.target.value = ''; return;
    }
    loadTemplate(v);
  }
  e.target.value = '';
};

function clearAll() {
  Object.keys(nodes).forEach(deleteNode);
  regions.slice().forEach(deleteRegion);
  nid = eid = rid = 0;
}

// ---- Toolbar ----
document.getElementById('btn-clear').onclick = () => {
  if (!confirm('Clear the whole canvas?')) return;
  clearAll();
};
document.getElementById('btn-export').onclick = () => {
  const data = {
    edgeMode,
    nodes: Object.values(nodes).map(n => ({ id: n.id, key: n.key, icon: n.icon, label: n.label, x: n.x, y: n.y })),
    edges: edges.map(e => ({ id: e.id, from: e.from, to: e.to, label: e.label })),
    regions: regions.map(r => ({ id: r.id, title: r.title, x: r.x, y: r.y, w: r.w, h: r.h, color: r.color })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'system-design.json';
  a.click();
};
document.getElementById('btn-import').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      clearAll();
      edgeMode = d.edgeMode === 'ortho' ? 'ortho' : 'curved';
      document.getElementById('btn-edgestyle').textContent =
        'Edges: ' + (edgeMode === 'curved' ? 'Curved' : 'Orthogonal');
      (d.regions || []).forEach(rg => {
        createRegion(rg);
        const num = parseInt(String(rg.id).replace(/\D/g,'')) || 0; rid = Math.max(rid, num);
      });
      d.nodes.forEach(n => {
        createNode({ key: n.key, icon: n.icon, label: n.label }, n.x, n.y, n.id, n.label);
        const num = parseInt(String(n.id).replace(/\D/g,'')) || 0; nid = Math.max(nid, num);
      });
      (d.edges || []).forEach(ed => {
        createEdge(ed.from, ed.to, ed.id, ed.label);
        const num = parseInt(String(ed.id).replace(/\D/g,'')) || 0; eid = Math.max(eid, num);
      });
    } catch (err) { alert('Could not import: ' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
};
